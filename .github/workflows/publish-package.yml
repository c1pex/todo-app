name: "Publish to GitHub Packages (Maven)"

on:
  workflow_run:
    workflows: ["CI / Build & Release"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check if version is already released
        id: check
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/c1pex/todo-app/releases/tags/v$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Release check for v$VERSION returned HTTP $STATUS."

      - name: Publish to GitHub Packages
        if: steps.check.outputs.release_status != '200'
        run: ./gradlew --no-daemon publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version already published, skipping
        if: steps.check.outputs.release_status == '200'
        run: echo "Version ${{ steps.check.outputs.version }} is already released; skipping publish."